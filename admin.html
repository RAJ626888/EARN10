
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EARN10 Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#111827;color:#fff;padding:20px}
.container{max-width:1250px;margin:auto}
.header,.panel,.login-card,.stat-card{background:#1f2937;border:1px solid #374151;border-radius:14px;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.subtitle{color:#9ca3af;margin-top:8px;font-size:14px}
button{border:0;border-radius:8px;padding:10px 13px;color:#fff;font-weight:bold;cursor:pointer;margin:2px}
input{width:100%;padding:13px;margin:10px 0;border:0;border-radius:8px;font-size:15px}
.login-card{max-width:430px;margin:50px auto}
.login-btn{background:#16a34a;width:100%}
.logout,.reject-btn{background:#dc2626}
.refresh{background:#2563eb;margin-bottom:15px}
.paid-btn{background:#16a34a}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat-card p{color:#9ca3af;font-size:14px;margin-bottom:12px}
.stat-card h2{font-size:26px;color:#22c55e;overflow-wrap:anywhere}
.table-wrap{overflow-x:auto}
table{width:100%;min-width:900px;border-collapse:collapse}
th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #374151;font-size:14px}
th{color:#9ca3af}
.pending{color:#fbbf24;font-weight:bold}
.paid{color:#22c55e;font-weight:bold}
.rejected{color:#f87171;font-weight:bold}
.message{margin:12px 0;padding:12px;background:#374151;border-radius:8px;overflow-wrap:anywhere}
.empty{text-align:center;padding:25px;color:#9ca3af}
@media(max-width:800px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){body{padding:10px}.header{align-items:flex-start}.stat-card{padding:13px}.stat-card h2{font-size:21px}}
</style>
</head>

<body>
<div class="container">

  <div id="loginSection" class="login-card">
    <h2>🔐 EARN10 Admin Login</h2>
    <p class="subtitle">Login with your authorized admin account.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button class="login-btn" type="submit">Login</button>
    </form>
    <div id="loginMessage" class="message" hidden></div>
  </div>

  <section id="adminSection" hidden>
    <div class="header">
      <div>
        <h1>💰 EARN10 Admin</h1>
        <p class="subtitle">Dashboard & Withdrawal Management</p>
      </div>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <p>Total Users</p>
        <h2 id="totalUsers">—</h2>
      </div>
      <div class="stat-card">
        <p>Total Referrals</p>
        <h2 id="totalReferrals">—</h2>
      </div>
      <div class="stat-card">
        <p>Total Wallet Balance</p>
        <h2 id="totalBalance">—</h2>
      </div>
      <div class="stat-card">
        <p>Total Withdrawals</p>
        <h2 id="totalWithdrawals">—</h2>
      </div>
    </div>

    <div class="panel">
      <h2 style="margin-bottom:15px">Withdrawal Requests</h2>
      <button class="refresh" id="refreshBtn">🔄 Refresh Dashboard</button>
      <div id="adminMessage" class="message" hidden></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>User</th><th>Email</th>
              <th>Amount</th><th>UPI ID</th>
              <th>Status</th><th>Date</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="withdrawalTable">
            <tr><td colspan="8" class="empty">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</div>

<script>
const SUPABASE_URL =
  "https://rwwihwmlsdqafehtywdl.supabase.co";

const SUPABASE_KEY = "sb_publishable_Z6I8JiR_xrHXejySO7QokA_bSqpjGTI";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

function message(id, text) {
  $(id).textContent = text;
  $(id).hidden = false;
}

function formatMoney(value) {
  return "₹" + Number(value || 0).toLocaleString("en-IN", {
    maximumFractionDigits: 2
  });
}

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function dateText(value) {
  if (!value) return "—";
  const date = new Date(value);
  return Number.isNaN(date.getTime())
    ? "—"
    : date.toLocaleString("en-IN");
}

async function loadDashboard() {
  $("refreshBtn").disabled = true;
  $("refreshBtn").textContent = "Loading...";

  try {
    // Each RPC verifies admin permission on the server.
    const [statsResult, withdrawalsResult] = await Promise.all([
      db.rpc("get_admin_stats"),
      db.rpc("get_admin_withdrawals")
    ]);

    if (statsResult.error) throw statsResult.error;
    if (withdrawalsResult.error) throw withdrawalsResult.error;

    const stats = statsResult.data || {};

    $("totalUsers").textContent =
      Number(stats.total_users || 0).toLocaleString("en-IN");

    $("totalReferrals").textContent =
      Number(stats.total_referrals || 0).toLocaleString("en-IN");

    $("totalBalance").textContent =
      formatMoney(stats.total_balance);

    $("totalWithdrawals").textContent =
      formatMoney(stats.total_withdrawals);

    renderWithdrawals(withdrawalsResult.data || []);
    $("adminMessage").hidden = true;
  } catch (error) {
    message("adminMessage", "Error: " + error.message);
  } finally {
    $("refreshBtn").disabled = false;
    $("refreshBtn").textContent = "🔄 Refresh Dashboard";
  }
}

function renderWithdrawals(rows) {
  const table = $("withdrawalTable");

  if (!rows.length) {
    table.innerHTML =
      '<tr><td colspan="8" class="empty">No withdrawal requests found.</td></tr>';
    return;
  }

  table.innerHTML = rows.map(row => {
    const status = String(row.status || "pending").toLowerCase();
    let action = "—";

    if (status === "pending") {
      action = `
        <button class="paid-btn"
          data-id="${Number(row.id)}" data-status="paid">
          Paid
        </button>
        <button class="reject-btn"
          data-id="${Number(row.id)}" data-status="rejected">
          Reject
        </button>`;
    }

    const statusClass =
      status === "paid" ? "paid" :
      status === "rejected" ? "rejected" : "pending";

    return `
      <tr>
        <td>#${Number(row.id)}</td>
        <td>${safe(row.name || "User")}</td>
        <td>${safe(row.email || "—")}</td>
        <td>${formatMoney(row.amount)}</td>
        <td>${safe(row.upi_id || "—")}</td>
        <td class="${statusClass}">${safe(status.toUpperCase())}</td>
        <td>${safe(dateText(row.created_at))}</td>
        <td>${action}</td>
      </tr>`;
  }).join("");
}

$("withdrawalTable").addEventListener("click", async event => {
  const button = event.target.closest("button[data-status]");
  if (!button || button.disabled) return;

  const id = Number(button.dataset.id);
  const status = button.dataset.status;

  const promptText = status === "paid"
    ? "Have you actually paid this user by UPI? Mark as PAID?"
    : "Reject this request and refund its amount to the user's wallet?";

  if (!Number.isSafeInteger(id) || !confirm(promptText)) return;

  button.disabled = true;

  try {
    const { error } = await db.rpc("admin_update_withdrawal", {
      p_request_id: id,
      p_status: status
    });

    if (error) throw error;

    message(
      "adminMessage",
      status === "paid"
        ? "Request marked as PAID."
        : "Request rejected. Check the user's wallet for the refund."
    );

    await loadDashboard();
  } catch (error) {
    alert("Update failed: " + error.message);
    button.disabled = false;
  }
});

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  const email = $("email").value.trim();
  const password = $("password").value;

  message("loginMessage", "Checking login and admin permission...");

  const { error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message("loginMessage", "Login failed: " + error.message);
    return;
  }

  // Verify admin privileges on the server before showing the panel.
  const { error: checkError } =
    await db.rpc("get_admin_withdrawals");

  if (checkError) {
    await db.auth.signOut();
    message("loginMessage", "Admin access denied: " + checkError.message);
    return;
  }

  $("loginSection").hidden = true;
  $("adminSection").hidden = false;
  await loadDashboard();
});

$("refreshBtn").addEventListener("click", loadDashboard);

$("logoutBtn").addEventListener("click", async () => {
  await db.auth.signOut();
  $("adminSection").hidden = true;
  $("loginSection").hidden = false;
  $("password").value = "";
  $("loginMessage").hidden = true;
});

async function checkExistingSession() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return;

  const { error } = await db.rpc("get_admin_withdrawals");

  if (error) {
    await db.auth.signOut();
    return;
  }

  $("loginSection").hidden = true;
  $("adminSection").hidden = false;
  await loadDashboard();
}

checkExistingSession();
</script>
</body>
</html>
